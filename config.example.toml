[application]
schema_version = 1
deployment_profile = "local"

[server]
host = "127.0.0.1"
port = 8765
mcp_http_enabled = true
mcp_http_path = "/mcp"
mcp_http_stateless = false
# JSON responses avoid long-lived SSE cleanup races for short tool calls.
mcp_http_json_response = true
# Reap clients that abandon a stateful MCP Session without sending DELETE.
# 1800s (30 minutes) follows the MCP SDK recommendation for most deployments and
# keeps ordinary 8-15 minute local builds/tests from losing a healthy session.
# An expired/unknown session id still returns the specification 404 with
# code=mcp_session_expired and required_action=reconnect_mcp_session.
mcp_http_session_idle_timeout_seconds = 1800.0
# Tolerant adoption (default true): a request that presents an unknown or reaped
# mcp-session-id but valid credentials rebuilds the transport binding on the spot
# and answers 200, resuming the same Room Session when the identity matches, so a
# host client that never re-initialises is not locked out after an idle reap.
# false = strict mode: keep the specification 404 plus the #116
# mcp_session_expired / reconnect_mcp_session recovery contract.
mcp_http_session_adoption = true
# Bounded tombstone table that maps a reaped transport session id to its Room
# Session binding (count and age limits; oldest entries are evicted first).
mcp_http_tombstone_limit = 256
mcp_http_tombstone_ttl_seconds = 86400.0
# Command used by a remote stdio Bridge on each Agent computer.
mcp_bridge_command = "python"
external_base_url = ""
# Only trust forwarded headers from explicitly configured proxy addresses.
trusted_proxy_headers = true
trusted_proxy_ips = "127.0.0.1"

[database]
backend = "sqlite"
url_env = "AGENTCHATROOM_DATABASE_URL"
pool_min_size = 1
pool_max_size = 10
connect_timeout_seconds = 10.0

[coordination]
# MCP roots bind timeout (seconds); 0 is invalid, max 60.
mcp_roots_timeout_seconds = 5.0
heartbeat_timeout_seconds = 45
# Long-running local MCP and remote Bridge processes keep joined sessions alive.
presence_keepalive_enabled = true
presence_keepalive_interval_seconds = 15.0
session_token_ttl_seconds = 43200
default_lease_ttl_seconds = 1800
max_lease_ttl_seconds = 86400
sse_poll_interval_seconds = 0.5
presence_refresh_interval_seconds = 1.0
# SSE occupancy caps; over-limit streams return 429 sse_limit_exceeded.
max_sse_clients_per_project = 64
sse_per_ip_limit = 16
# Web audit list page size (events per page).
audit_window_size = 100
# Batched write-through for session token last_used_at updates.
token_touch_interval_seconds = 60.0
token_touch_min_calls = 32
# MCP room_bootstrap/room_sync injected recent Agent messages (1-10).
mcp_message_limit = 5
# Size bounds for room submissions: oversized message bodies / task texts are
# rejected with message_body_too_long / task_text_too_long instead of being
# stored and re-downloaded by every client.
message_max_body_length = 65536
task_text_max_length = 32768
# List-shaped inputs and project document content are bounded (#175).
list_input_max_count = 100
test_entry_notes_max_length = 4000
project_document_max_bytes = 262144
# room_sync/Web snapshot reports/reviews/acks recent window (#183).
snapshot_recent_limit = 200
# Idempotency record retention in days; 0 = keep forever (#200).
idempotency_retention_days = 30

[knowledge]
# Knowledge Asset kinds enabled for this deployment. Each kind must match
# ^[a-z][a-z0-9_-]{0,63}$ and at least one kind is required.
kinds = [
    "decision",
    "procedure",
    "pitfall",
    "verification",
    "preference",
    "reference",
]
# Approving a Knowledge Asset tied to a task requires that task to be
# independently verified first.
require_verified_task = true

[documents]
# Character cap for binding-document injection on task claim/get responses.
# Precedence: AGENTCHATROOM_PROJECT_DOC_INJECT_MAX_CHARS > this file key > default.
inject_max_chars = 12000

[security]
agent_token_ttl_seconds = 2592000
max_agent_token_ttl_seconds = 31536000
mcp_http_auth_required = true
management_auth_required = false
management_token_env = "AGENTCHATROOM_ADMIN_TOKEN"
management_session_ttl_seconds = 43200
management_cookie_name = "agentchatroom_admin"
management_login_max_failures = 5
management_login_window_seconds = 60
management_login_lockout_seconds = 60

[interface]
product_name = "AgentChatRoom"
default_theme = "system"

[backup]
# Auto-backup scheduling (global). Precedence: AGENTCHATROOM_AUTO_BACKUP_* > this file > defaults.
auto_backup_enabled = false
auto_backup_interval_seconds = 3600
auto_backup_max_kept = 10
