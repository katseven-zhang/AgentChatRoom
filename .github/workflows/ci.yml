name: CI

on:
  push:
  pull_request:
  schedule:
    # The reachable-history audit walks every blob, so it is a daily trunk
    # report rather than a per-merge gate; the working-tree audit below still
    # blocks every push and pull request.
    - cron: "17 3 * * *"

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check release requirements are still derived from uv.lock
        run: |
          python -m pip install "uv==0.12.13"
          uv export --frozen --no-dev --extra postgresql --no-editable --no-emit-project -o requirements-docker.txt
          uv export --frozen --no-dev --extra dev --extra gui --no-editable --no-emit-project -o requirements-windows.txt
          git diff --exit-code requirements-docker.txt requirements-windows.txt
      - name: Check image build context size
        run: python scripts/check_build_context.py
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Check Web JavaScript
        run: node --check src/agentchatroom/web/app.js
      - name: Compile source package
        run: python -m compileall -q src/agentchatroom
      - name: Audit public release surface
        run: python scripts/audit_public_release.py
      - name: Check whitespace hygiene
        shell: bash
        run: git diff --check

  release-history:
    name: Audit reachable Git history for private runtime data
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit every reachable blob
        run: python scripts/audit_public_release.py --history
