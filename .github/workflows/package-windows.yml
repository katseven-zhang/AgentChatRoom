name: Package Windows EXE

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-windows.yml"
      - "agentchatroom.spec"
      - "packaging/**"
      - "pyproject.toml"
      - "src/**"
      - "tests/test_gui.py"
      - "tests/test_web_assets.py"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach the Windows ZIP to (optional)
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"
          python -m pip install "pyinstaller==6.22.2"

      - name: Validate source before packaging
        shell: pwsh
        run: |
          python -m pytest -p no:cacheprovider --basetemp="$env:RUNNER_TEMP\acr-source-tests"
          if ($LASTEXITCODE -ne 0) { throw "Source regression tests failed" }
          node --check src/agentchatroom/web/app.js

      - name: Build onedir GUI package
        shell: pwsh
        run: |
          $env:PYINSTALLER_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "pyinstaller-cache"
          python -m PyInstaller --clean --noconfirm agentchatroom.spec

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist\agentchatroom\agentchatroom.exe")) {
            throw "PyInstaller did not produce dist\agentchatroom\agentchatroom.exe"
          }
          $env:AGENTCHATROOM_TEST_EXE = (Resolve-Path "dist\agentchatroom\agentchatroom.exe").Path
          python -m pytest tests/test_gui.py tests/test_stdio_runtime.py tests/test_mcp.py::test_local_mcp_stdio_waits_for_bootstrap_and_disconnects_on_exit tests/test_mcp.py::test_mcp_stdio_round_trip -p no:cacheprovider --basetemp="$env:RUNNER_TEMP\acr-package-tests"

      - name: Smoke test default GUI window
        shell: pwsh
        run: |
          # #161: the default double-click path is the Tk console; the
          # package is unusable if it exits immediately or displays an
          # unhandled-exception dialog (which keeps the process alive).
          $bundle = "dist\agentchatroom"
          $initTcl = Get-ChildItem -Path $bundle -Recurse -Filter "init.tcl" | Select-Object -First 1
          if (-not $initTcl) {
            throw "Tcl/Tk init.tcl is missing from the package; tkinter was not bundled"
          }
          $exe = Join-Path (Resolve-Path $bundle).Path "agentchatroom.exe"
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path $bundle).Path -PassThru
          try {
            Start-Sleep -Seconds 15
            $proc.Refresh()
            if ($proc.HasExited) {
              throw "Default GUI exited immediately with code $($proc.ExitCode); Tcl/Tk console did not start"
            }
            $windowTitle = (Get-Process -Id $proc.Id).MainWindowTitle
            if ($windowTitle -ne "AgentChatRoom 控制台") {
              throw "Default GUI did not open the expected console window; actual title: '$windowTitle'"
            }
          } finally {
            $proc.Refresh()
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          Write-Host "Default GUI smoke passed: console window opened and init.tcl is bundled."

      - name: Create downloadable archive
        shell: pwsh
        run: Compress-Archive -Path "dist\agentchatroom" -DestinationPath "dist\agentchatroom-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentchatroom-windows-x64
          path: dist/agentchatroom-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive to published release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: dist/agentchatroom-windows-x64.zip
          fail_on_unmatched_files: true
