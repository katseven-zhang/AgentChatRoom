[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchatroom"
version = "0.3.1"
description = "Local-first coordination room for heterogeneous coding agents"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AgentChatRoom Contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "mcp>=1.29.1,<2",
  "typing-extensions>=4.12,<5",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
gui = [
  "pystray>=0.19",
  "pillow>=10.0",
]
postgresql = [
  "psycopg[binary,pool]>=3.2,<4",
]
dev = [
  "httpx>=0.28,<1",
  "pillow>=10.0",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
agentchatroom = "agentchatroom.cli:main"
agentchatroom-gui = "agentchatroom.gui:main"
agentchatroom-mcp = "agentchatroom.mcp_server:main"
agentchatroom-mcp-bridge = "agentchatroom.mcp_bridge:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentchatroom = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 直接运行 pytest.exe / IDE 测试插件时解释器不会隐式补齐当前目录，
# scripts.* 与 tests.* 的模块导入依赖 rootdir 在 sys.path 上。
pythonpath = ["."]
addopts = "-q"
