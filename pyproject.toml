[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchatroom"
version = "0.2.2"
description = "Local-first coordination room for heterogeneous coding agents"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AgentChatRoom Contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "mcp>=1.12,<2",
  "typing-extensions>=4.12,<5",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
postgresql = [
  "psycopg[binary,pool]>=3.2,<4",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
agentchatroom = "agentchatroom.cli:main"
agentchatroom-mcp = "agentchatroom.mcp_server:main"
agentchatroom-mcp-bridge = "agentchatroom.mcp_bridge:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentchatroom = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
